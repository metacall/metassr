name: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*

env:
  CARGO_INCREMENTAL: 0

jobs:
  release:
    name: ${{ matrix.target }}
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        uses: SebRollen/toml-action@v1.0.0
        with:
          file: Cargo.toml
          field: package.version

      - name: Extract release notes
        env:
          VERSION: ${{ steps.get_version.outputs.value }}
        run: |
          awk "/^## \\[${VERSION}\]/{flag=1; next} /^## / && flag{exit} flag" CHANGELOG.md > "$RUNNER_TEMP/REL.md"
          if [ ! -s "$RUNNER_TEMP/REL.md" ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}. Run ./scripts/changelog.sh before tagging."
            exit 1
          fi
          echo "REL=$RUNNER_TEMP/REL.md" >> "$GITHUB_ENV"

      - name: Set artifact name
        shell: bash
        run: |
          version="$(git describe --tags --match='v*' --always)"
          name="metassr-$version-${{ matrix.target }}"
          echo "ARTIFACT_NAME=$name" >> $GITHUB_ENV
          echo "version: $version"
          echo "artifact: $name"
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          target: ${{ matrix.target }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v1

      - name: Build binary
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --locked --target=${{ matrix.target }} --color=always --verbose
          use-cross: ${{ runner.os == 'Linux' }}

      - name: Package (*nix)
        run: >
          echo "install -Dm755 ./metassr /usr/bin" > "install.sh" && 
          tar -cv
          install.sh LICENSE README.md ./docs/
          -C target/${{ matrix.target }}/release/ metassr-cli
          | gzip --best
          > 'metassr-${{ steps.get_version.outputs.value }}-${{ matrix.target }}.tar.gz'

      - name: Upload artifact
        uses: actions/upload-artifact@v2
        with:
          name: ${{ matrix.target }}
          path: |
            *.deb
            *.tar.gz
            *.zip
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: ${{ env.REL }}
          files: |
            *.deb
            *.tar.gz
            *.zip
          name: ${{ steps.get_version.outputs.value }}