[package]
name = "metacall-toolchain"
version.workspace = true
edition = "2021"
description = "Install, pin and wire MetaCall loaders and their runtimes"
license-file = "../../LICENSE"

[dependencies]
minisign-verify = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
thiserror = "2.0"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zstd = "0.13"

[dev-dependencies]
minisign = "0.7"
tempfile = "3"
